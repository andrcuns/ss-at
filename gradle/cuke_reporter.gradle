import net.masterthought.cucumber.Configuration
import net.masterthought.cucumber.ReportBuilder

buildscript {
    repositories {
        jcenter()
    }
    dependencies {
        classpath "net.masterthought:cucumber-reporting:3.16.0"
    }
}

project.ext.reportDir = "${project.buildDir}/reports"

Map reports = [
        'Sequential': "${reportDir}/cucumber-report",
        'Parallel'  : "${reportDir}/courgette-report/data"
]

reports.each { String type, String reportPath ->
    tasks.create("generate${type}CucumberReport") {
        description = "Generate cucumber HTML reports"
        doLast {
            def jsonReports = fileTree(dir: reportPath, include: '**/*.json')
            File reportOutputDirectory = new File(reportDir)

            List<String> jsonReportFiles = jsonReports.collect { "${it.absolutePath}".toString() } as List<String>

            def configuration = new Configuration(reportOutputDirectory, "ss-at")

            ReportBuilder reportBuilder = new ReportBuilder(jsonReportFiles, configuration)
            reportBuilder.generateReports()
            logger.quiet("Report available on: file://${reportDir}/cucumber-html-reports/overview-features.html")
        }
    }
}